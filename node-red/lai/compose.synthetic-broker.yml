services:
  cpslai1-synthetic-mosquitto:
    image: eclipse-mosquitto:2
    container_name: cpslai1-synthetic-mosquitto
    restart: "no"
    ports:
      - "127.0.0.1:1884:1884"
      - "127.0.0.1:9002:9002"
    volumes:
      - ../../mosquitto/synthetic/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
